name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create temporary Capacitor app
        run: |
          mkdir apk-wrapper
          cd apk-wrapper

          npm init -y

          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3
          npm install -D typescript

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ir.sadrahome.app',
            appName: 'صدرا ملک',
            webDir: 'www',
            server: {
              url: 'https://sadra-home-finder.lovable.app',
              cleartext: false
            }
          };

          export default config;
          EOF

          mkdir www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>صدرا ملک</title>
          </head>
          <body>
            <h1>صدرا ملک</h1>
          </body>
          </html>
          EOF

          npx cap add android

      - name: Build Android APK
        working-directory: apk-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadra-melk-apk
          path: apk-wrapper/android/app/build/outputs/apk/debug/app-debug.apk