name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ir.sadrahome.app',
            appName: 'صدرا ملک',
            webDir: 'dist',
            server: {
              url: 'https://sadra-home-finder.lovable.app',
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Verify Capacitor Android files
        run: |
          echo "Checking Android project..."
          ls -la android
          echo "Checking capacitor.settings.gradle..."
          if [ -f android/capacitor.settings.gradle ]; then
            echo "capacitor.settings.gradle exists"
          else
            echo "ERROR: capacitor.settings.gradle was NOT created"
            echo "Capacitor CLI version:"
            npx cap --version
            echo "Installed Capacitor packages:"
            npm ls @capacitor/core @capacitor/cli @capacitor/android
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadra-melk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk