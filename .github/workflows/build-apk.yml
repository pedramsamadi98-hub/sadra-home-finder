name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create Android wrapper
        run: |
          mkdir apk-wrapper
          cd apk-wrapper

          npm init -y

          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.sadrahome.app",
            "appName": "صدرا ملک",
            "webDir": "www",
            "server": {
              "url": "https://sadra-home-finder.lovable.app",
              "cleartext": false
            }
          }
          EOF

          mkdir www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <meta name="theme-color" content="#111827">
            <title>صدرا ملک</title>
          </head>
          <body>
            <div id="loading"
                 style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">
              در حال بارگذاری صدرا ملک...
            </div>

            <script>
              window.location.href = "https://sadra-home-finder.lovable.app";
            </script>
          </body>
          </html>
          EOF

          npx cap add android

      - name: Configure Android app
        working-directory: apk-wrapper/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")

          if manifest.exists():
              text = manifest.read_text()

              text = text.replace(
                  'android:theme="@style/AppTheme"',
                  'android:theme="@style/AppTheme" android:usesCleartextTraffic="false"'
              )

              manifest.write_text(text)
          PY

      - name: Sync Capacitor
        working-directory: apk-wrapper
        run: npx cap sync android

      - name: Build APK
        working-directory: apk-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadra-melk-full-apk
          path: apk-wrapper/android/app/build/outputs/apk/debug/app-debug.apk