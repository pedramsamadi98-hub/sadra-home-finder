name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Show build output
        run: |
          echo "===== PROJECT ====="
          git log -1 --oneline

          echo "===== OUTPUT DIRECTORIES ====="
          find . -maxdepth 3 -type d \( -name ".output" -o -name "dist" -o -name "build" \) -print

          echo "===== OUTPUT FILES ====="

          if [ -d ".output" ]; then
            find .output -maxdepth 4 -type f | sort | head -300
          fi

          if [ -d "dist" ]; then
            find dist -maxdepth 4 -type f | sort | head -300
          fi

      - name: Create Capacitor project
        run: |
          mkdir apk-wrapper
          cd apk-wrapper

          npm init -y

          npm install \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3

          mkdir www

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ir.sadrahome.app",
            "appName": "صدرا ملک",
            "webDir": "www"
          }
          EOF

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >
            <title>صدرا ملک</title>
          </head>
          <body>
            <h1>صدرا ملک</h1>
          </body>
          </html>
          EOF

          npx cap add android

      - name: Sync Capacitor
        working-directory: apk-wrapper
        run: npx cap sync android

      - name: Build APK
        working-directory: apk-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadra-melk-apk
          path: apk-wrapper/android/app/build/outputs/apk/debug/app-debug.apk