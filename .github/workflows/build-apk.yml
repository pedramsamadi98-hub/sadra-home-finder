name: Build APK - Sadra Melk

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Create Capacitor Android wrapper
        shell: bash
        run: |
          set -e

          rm -rf apk-wrapper

          mkdir -p apk-wrapper
          cd apk-wrapper

          npm init -y

          npm install \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3 \
            typescript@5.9.2

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ir.sadrahome.app',
            appName: 'صدرا ملک',
            webDir: 'www',

            server: {
              url: 'https://sadra-home-finder.lovable.app',
              cleartext: false
            },

            android: {
              backgroundColor: '#071A2B'
            }
          };

          export default config;
          EOF

          mkdir -p www

          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
              />
              <title>صدرا ملک</title>
            </head>
            <body>
              <div id="root">صدرا ملک</div>
            </body>
          </html>
          EOF

          npx cap add android
          npx cap sync android

      - name: Apply Sadra Melk branding
        shell: bash
        run: |
          set -e

          ICON="src/assets/sadra-icon.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: $ICON not found"
            exit 1
          fi

          ANDROID_RES="apk-wrapper/android/app/src/main/res"

          mkdir -p "$ANDROID_RES/mipmap-mdpi"
          mkdir -p "$ANDROID_RES/mipmap-hdpi"
          mkdir -p "$ANDROID_RES/mipmap-xhdpi"
          mkdir -p "$ANDROID_RES/mipmap-xxhdpi"
          mkdir -p "$ANDROID_RES/mipmap-xxxhdpi"

          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert "$ICON" -resize 48x48 \
            "$ANDROID_RES/mipmap-mdpi/ic_launcher.png"

          convert "$ICON" -resize 72x72 \
            "$ANDROID_RES/mipmap-hdpi/ic_launcher.png"

          convert "$ICON" -resize 96x96 \
            "$ANDROID_RES/mipmap-xhdpi/ic_launcher.png"

          convert "$ICON" -resize 144x144 \
            "$ANDROID_RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$ICON" -resize 192x192 \
            "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher.png"

          STRINGS="$ANDROID_RES/values/strings.xml"

          if [ -f "$STRINGS" ]; then
            sed -i 's#<string name="app_name">.*</string>#<string name="app_name">صدرا ملک</string>#' "$STRINGS"
          fi

          echo "Branding applied successfully."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd apk-wrapper/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "GENERATED APK"
          echo "======================================"

          find apk-wrapper/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadra-melk-final
          path: apk-wrapper/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error