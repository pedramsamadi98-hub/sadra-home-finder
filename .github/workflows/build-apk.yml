name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build real TanStack Start project
        run: npm run build

      - name: Create Capacitor wrapper
        run: |
          rm -rf apk-wrapper
          mkdir apk-wrapper
          cd apk-wrapper

          npm init -y

          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3
          npm install -D typescript@5.9.2

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ir.sadrahome.app',
            appName: 'صدرا ملک',
            webDir: 'www'
          };

          export default config;
          EOF

          mkdir www

          cp -r ../.output/public/* www/

          echo "========================================"
          echo "REAL PROJECT BUILD"
          echo "========================================"

          find www -maxdepth 3 -type f | sort | head -200

          npx cap add android
          npx cap sync android

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Android Java compatibility
        run: |
          cd apk-wrapper/android

          sed -i 's/sourceCompatibility JavaVersion.VERSION_21/sourceCompatibility JavaVersion.VERSION_17/g' app/build.gradle || true
          sed -i 's/targetCompatibility JavaVersion.VERSION_21/targetCompatibility JavaVersion.VERSION_17/g' app/build.gradle || true
          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' build.gradle || true

      - name: Apply Sadra Melk branding (icon + splash)
        run: |
          RES=apk-wrapper/android/app/src/main/res

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$D"
            cp "android-branding/icons/$D-ic_launcher.png" "$RES/mipmap-$D/ic_launcher.png"
            cp "android-branding/icons/$D-ic_launcher_round.png" "$RES/mipmap-$D/ic_launcher_round.png"
            cp "android-branding/icons/foreground.png" "$RES/mipmap-$D/ic_launcher_foreground.png"
          done

          mkdir -p "$RES/drawable" "$RES/values"
          cp android-branding/splash/splash.png "$RES/drawable/splash.png"

          # adaptive icon background color (dark navy)
          cat > "$RES/values/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0A162B</color>
          </resources>
          EOF

          # splash screen theme colors
          cat > "$RES/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@color/splash_background</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash</item>
              </style>
              <color name="splash_background">#0A162B</color>
          </resources>
          EOF

          # app display name
          cat > "$RES/values/strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">صدرا ملک</string>
              <string name="title_activity_main">صدرا ملک</string>
              <string name="package_name">ir.sadrahome.app</string>
              <string name="custom_url_scheme">ir.sadrahome.app</string>
          </resources>
          EOF

      - name: Build APK
        run: |
          cd apk-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find apk-wrapper/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadra-melk-apk
          path: apk-wrapper/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error