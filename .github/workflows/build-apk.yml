name: Inspect Android Build

on:
  workflow_dispatch:

jobs:
  inspect-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ir.sadrahome.app',
            appName: 'صدرا ملک',
            webDir: 'dist',
            server: {
              url: 'https://sadra-home-finder.lovable.app',
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Inspect Android files
        run: |
          echo "========================================"
          echo "ANDROID DIRECTORY"
          echo "========================================"
          find android -maxdepth 3 -type f | sort

          echo ""
          echo "========================================"
          echo "android/settings.gradle"
          echo "========================================"

          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          else
            echo "settings.gradle NOT FOUND"
          fi

          echo ""
          echo "========================================"
          echo "capacitor.settings.gradle"
          echo "========================================"

          if [ -f android/capacitor.settings.gradle ]; then
            cat android/capacitor.settings.gradle
          else
            echo "capacitor.settings.gradle NOT FOUND"
          fi

          echo ""
          echo "========================================"
          echo "CAPACITOR VERSION"
          echo "========================================"
          npx cap --version

          echo ""
          echo "========================================"
          echo "CAPACITOR PACKAGES"
          echo "========================================"
          npm ls @capacitor/core @capacitor/cli @capacitor/android