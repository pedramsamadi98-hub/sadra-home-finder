name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build real TanStack Start project
        run: npm run build

      - name: Create Capacitor wrapper
        run: |
          rm -rf apk-wrapper
          mkdir apk-wrapper
          cd apk-wrapper

          npm init -y

          npm install \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3

          npm install -D typescript@5.9.2

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ir.sadrahome.app',
            appName: 'صدرا ملک',
            webDir: 'www',
            server: {
              url: 'https://sadra-home-finder.lovable.app',
              cleartext: false
            }
          };

          export default config;
          EOF

          mkdir www

          cp -r ../.output/public/* www/

          echo "========================================"
          echo "REAL PROJECT FILES"
          echo "========================================"
          find www -maxdepth 3 -type f | sort | head -200

          echo "========================================"
          echo "ADDING ANDROID"
          echo "========================================"

          npx cap add android

          echo "========================================"
          echo "SYNC CAPACITOR"
          echo "========================================"

          npx cap sync android

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Android Java compatibility
        run: |
          cd apk-wrapper/android

          echo "========================================"
          echo "ANDROID JAVA VERSION"
          echo "========================================"

          sed -i 's/sourceCompatibility JavaVersion.VERSION_21/sourceCompatibility JavaVersion.VERSION_17/g' app/build.gradle || true
          sed -i 's/targetCompatibility JavaVersion.VERSION_21/targetCompatibility JavaVersion.VERSION_17/g' app/build.gradle || true

          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' build.gradle || true

          echo "========================================"
          echo "BUILD GRADLE"
          echo "========================================"

          cat app/build.gradle

      - name: Build APK
        run: |
          cd apk-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find apk-wrapper/android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadra-melk-apk
          path: apk-wrapper/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error